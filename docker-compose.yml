services:
  postgres:
    image: postgres:16-alpine
    container_name: antika-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: antika
      POSTGRES_PASSWORD: antika
      POSTGRES_DB: antika
    ports:
      - "5433:5432"
    volumes:
      - antika_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antika -d antika"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  antika_pgdata:
